<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safeguard for browser/iframe environments where window.fetch has only a getter
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            let currentFetch = originalFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get() {
                  return currentFetch;
                },
                set(newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('Cannot set property fetch of #<Window> which has only a getter')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardVault</title>
    <meta name="description" content="Secure instant delivery digital card marketplace." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
